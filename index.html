<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17171b"><meta name="apple-mobile-web-app-capable" content="yes"><title>影像拆解室｜短影音數據分析</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#f5f1ed;background:#17171b}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:24px 20px 80px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3d3a3b;padding-bottom:18px}.brand{font-size:20px;font-weight:800;letter-spacing:.04em}.brand b{color:#e8bd8e}.pill{border:1px solid #6e5b4b;color:#e8bd8e;border-radius:30px;padding:6px 11px;font-size:13px}h1{font-size:clamp(28px,5vw,43px);line-height:1.2;margin:30px 0 8px}p{line-height:1.55}.sub{color:#bbb4ae;margin:0 0 28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#232328;border:1px solid #3a383b;border-radius:22px;padding:22px}.card h2{font-size:18px;margin:0 0 16px}.step{color:#e8bd8e;font-size:13px;font-weight:700;margin-right:8px}label{display:block;color:#dcd6d2;font-size:14px;font-weight:600;margin:13px 0 7px}input:not([type=file]),textarea,select{width:100%;background:#17171b;color:#fff;border:1px solid #545057;border-radius:11px;padding:13px;outline:none}input:focus,textarea:focus,select:focus{border-color:#e8bd8e}textarea{resize:vertical;min-height:95px}.upload{display:block;border:1px dashed #8b7668;border-radius:15px;padding:17px;text-align:center;background:#2a2627;margin:9px 0}.upload strong{display:block;color:#f1d1ac}.upload small{display:block;color:#bdb4af;margin-top:5px}.upload input{position:absolute;opacity:0;width:1px;height:1px}video{width:100%;max-height:360px;border-radius:12px;background:#111;display:none;margin:14px 0 5px}.shots{display:flex;gap:8px;overflow:auto;margin-top:10px}.shots img{height:94px;border-radius:9px;border:1px solid #555}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.hint{font-size:13px;color:#aca5a3}.action{border:0;border-radius:13px;background:#e8bd8e;color:#17171b;font-weight:800;padding:16px 24px;width:100%;margin:22px 0 0}.action:active{transform:scale(.99)}.results{margin-top:22px;display:none}.results.show{display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#2b2a2f;border-radius:15px;padding:17px}.stat strong{display:block;font-size:27px;margin:5px 0}.stat small{color:#beb6b1}.flag{border-left:3px solid #e8bd8e;background:#2c2828;padding:15px 17px;margin:11px 0;border-radius:0 12px 12px 0;line-height:1.6}.flag b{display:block;color:#f2d0aa}.script{background:#18181c;border-radius:15px;padding:17px;line-height:1.8;white-space:pre-wrap;color:#f5ece5}.timeline{display:flex;justify-content:space-between;gap:8px;margin:12px 0;color:#bdb4af;font-size:13px}.timeline span{border-top:3px solid #a88468;flex:1;padding-top:9px}.copy{border:1px solid #b29579;background:transparent;color:#edcba8;border-radius:10px;padding:10px 15px;margin-top:13px}.privacy{color:#a9a1a0;font-size:13px;margin-top:20px}@media(max-width:750px){.wrap{padding:18px 14px 60px}.grid{grid-template-columns:1fr}.card{padding:18px}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:20px}.three{gap:7px}.top .pill{font-size:11px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">影像<b>拆解室</b></div><div class="pill">iPhone 也能用</div></header><h1>找出下一支影片<br>該改的那一秒。</h1><p class="sub">把影片、數據與口播內容放進來，得到有根據的調整方向和新腳本。</p><div class="grid"><section class="card"><h2><span class="step">01</span>影片與數據截圖</h2><label class="upload"><strong>＋ 選擇影片原檔</strong><small>支援 iPhone 相簿中的影片</small><input id="videoFile" type="file" accept="video/*"></label><div id="videoName" class="hint"></div><video id="preview" controls playsinline></video><label class="upload"><strong>＋ 加入數據截圖</strong><small>可選多張，方便對照平台後台</small><input id="imageFiles" type="file" accept="image/*" multiple></label><div id="imageName" class="hint"></div><div id="shots" class="shots"></div><p class="hint">截圖會顯示在這裡供你核對；請將主要數字填在右側，避免圖片辨識出錯。</p></section><section class="card"><h2><span class="step">02</span>輸入平台數字</h2><label for="platform">發布平台</label><select id="platform"><option>Instagram Reels</option><option>TikTok</option><option>YouTube Shorts</option><option>其他</option></select><div class="three"><div><label for="views">觀看數</label><input id="views" inputmode="numeric" type="number" min="0" placeholder="1200"></div><div><label for="shares">分享數</label><input id="shares" inputmode="numeric" type="number" min="0" placeholder="25"></div><div><label for="saves">收藏數</label><input id="saves" inputmode="numeric" type="number" min="0" placeholder="18"></div></div><div class="three"><div><label for="likes">按讚數</label><input id="likes" inputmode="numeric" type="number" min="0" placeholder="70"></div><div><label for="comments">留言數</label><input id="comments" inputmode="numeric" type="number" min="0" placeholder="8"></div><div><label for="avg">平均觀看秒數</label><input id="avg" inputmode="decimal" type="number" min="0" step="0.1" placeholder="9.5"></div></div><label for="retention">前 3 秒留存率（有就填）</label><input id="retention" inputmode="decimal" type="number" min="0" max="100" step="0.1" placeholder="例如 62%"><label for="topic">這支影片想讓誰看到？主題是什麼？</label><input id="topic" placeholder="例：25–35 歲女生，聊不敢發影片"><label for="opening">影片前 3 秒說了什麼？</label><textarea id="opening" placeholder="盡量貼原本的字幕或口播"></textarea><label for="body">原本口播／腳本重點</label><textarea id="body" placeholder="貼上原稿，或用 2–3 句描述內容與結尾"></textarea><button class="action" id="analyze">分析並改寫腳本</button></section></div><section id="results" class="results" aria-live="polite"><div class="card"><h2>這支影片的數據診斷</h2><div id="stats" class="stats"></div><div id="signals"></div></div><div class="grid" style="margin-top:20px"><div class="card"><h2>優先調整的段落</h2><div class="timeline"><span>0–3 秒<br>開頭</span><span>3–15 秒<br>故事</span><span>後段<br>轉折</span><span>結尾<br>分享理由</span></div><div id="changes"></div></div><div class="card"><h2>下一版腳本草稿</h2><div id="script" class="script"></div><button class="copy" id="copy">複製腳本</button><p class="hint">這是依填寫內容產生的編輯草稿。請對照影片畫面與語氣再微調。</p></div></div></section><p class="privacy">影片、圖片與填入資料只在這台裝置的瀏覽器處理，不會上傳或儲存。這個版本無法自動聽寫影片、辨識截圖文字或預測演算法推播。</p></main><script>
const $=id=>document.getElementById(id);let videoUrl,images=[];function n(id){let v=$(id).value;return v===''?null:Number(v)}function pct(a,b){return b>0?((a/b)*100).toFixed(1)+'%':'—'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('videoFile').addEventListener('change',e=>{const f=e.target.files[0];if(videoUrl)URL.revokeObjectURL(videoUrl);if(!f)return;videoUrl=URL.createObjectURL(f);$('preview').src=videoUrl;$('preview').style.display='block';$('videoName').textContent=f.name+' · '+(f.size/1048576).toFixed(1)+' MB'});
$('imageFiles').addEventListener('change',e=>{images.forEach(URL.revokeObjectURL);images=[...e.target.files].map(URL.createObjectURL);$('shots').replaceChildren(...images.map(url=>{let im=document.createElement('img');im.src=url;im.alt='數據截圖';return im}));$('imageName').textContent=e.target.files.length?`已加入 ${e.target.files.length} 張截圖`:''});
$('analyze').addEventListener('click',()=>{const v=n('views'),sh=n('shares'),sa=n('saves'),li=n('likes'),co=n('comments'),av=n('avg'),r=n('retention'),duration=Number.isFinite($('preview').duration)?$('preview').duration:null,topic=$('topic').value.trim(),opening=$('opening').value.trim(),body=$('body').value.trim();if(v===null&&(!opening&&!body)){alert('至少填入觀看數或原本的開頭／腳本，才能給你具體建議。');return}let sr=v>0&&sh!==null?sh/v:null,save=v>0&&sa!==null?sa/v:null,watch=duration&&av!==null?av/duration:null;let stats=[['分享率',sh===null?'未填':pct(sh,v),'分享數 ÷ 觀看數'],['收藏率',sa===null?'未填':pct(sa,v),'收藏數 ÷ 觀看數'],['平均觀看',av===null?'未填':av+' 秒',duration?`影片長 ${duration.toFixed(1)} 秒`:'可搭配影片長度判讀']];$('stats').innerHTML=stats.map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('');let signals=[],changes=[];if(v===0)signals.push(['目前沒有觀看數','先確認影片已發布及數據已更新，再比較表現。']);else if(v===null)signals.push(['觀看數尚未填入','填入觀看數後，才能計算分享率和收藏率。']);if(r!==null){signals.push([`前 3 秒留存 ${r}%`,r<55?'優先檢查第一句是否太慢進主題，並比對開頭畫面與標題。':'開頭有一定承接力；接著檢查故事中段是否拖慢節奏。'])}if(watch!==null){signals.push([`平均觀看約為片長 ${(watch*100).toFixed(0)}%`,watch<.35?'中段可能需要更早出現衝突或答案；這只是平均值，仍要看留存曲線。':'可保留目前節奏中的有效段落，再測不同開頭。'])}if(sr!==null){signals.push([`每 100 次觀看約 ${ (sr*100).toFixed(1)} 次分享`,sr<.01?'檢查影片是否提供一句觀眾會想轉給朋友的話，以及具體轉發對象。':'把引發共鳴的句子提前，測試是否帶動更多轉發。'])}if(save!==null&&save>sr&&sr!==null)signals.push(['收藏多於分享','內容有實用性；若想提高分享，可加入「這句傳給正在經歷的人」的情境。']);if(!signals.length)signals.push(['先補一項成效數字','目前先以腳本結構產生建議，無法判斷影片表現。']);$('signals').innerHTML=signals.map(x=>`<div class="flag"><b>${escapeHtml(x[0])}</b>${escapeHtml(x[1])}</div>`).join('');let hook=opening||'先把觀眾最在意的問題說出來';changes.push(['0–3 秒｜鉤子',opening?`原句：「${opening.slice(0,80)}」；把鋪陳拿掉，先講痛點或反差。畫面第一格也要對應這句話。`:'補上原開頭，才能比較新舊版本；目前建議直接從痛點或反差開始。']);changes.push(['3–15 秒｜故事','只留一個具體情境，讓觀眾知道「這跟我有什麼關係」，一句話只講一個重點。']);changes.push(['後段｜方法','用 1 個立刻能做的動作收束，避免連續塞進太多觀念。']);changes.push(['結尾｜分享','說明適合傳給哪種朋友，並讓結尾有一句能被轉述的話。']);$('changes').innerHTML=changes.map(x=>`<div class="flag"><b>${escapeHtml(x[0])}</b>${escapeHtml(x[1])}</div>`).join('');let subject=topic||'這個問題',take=body?body.split(/[。！？\n]/).map(s=>s.trim()).filter(Boolean)[0].slice(0,65):'你以為要先準備到完美，其實先改一個小地方就能開始';let newHook=opening?opening.replace(/^我/,'你').replace(/[。！？?]+$/,'')+'？':'你是不是也遇過這個問題？';let script=`【0–3 秒｜直接說問題】\n「${newHook}」\n\n【3–15 秒｜具體故事】\n「我以前也會這樣。${take}。」\n（畫面放一個真實例子，刪掉與主題無關的鋪陳。）\n\n【15–35 秒｜反轉＋一個方法】\n「後來我發現，關鍵不是一次把全部做好，而是先找出最卡的那一步。」\n「今天先做這件事：把你的第一句改成『觀眾正在煩惱的問題』，再錄一次。」\n\n【結尾｜分享理由】\n「如果你身邊也有人卡在這件事，把這支傳給她。你最想改掉哪一步？」`;if(!body)script=script.replace('我以前也會這樣。'+take+'。','我以前也會這樣。（在這裡補一個你的真實經歷。）');$('script').textContent=script;$('results').classList.add('show');$('results').scrollIntoView({behavior:'smooth',block:'start'})});$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('script').textContent);$('copy').textContent='已複製';setTimeout(()=>$('copy').textContent='複製腳本',1800)}catch(e){alert('請長按腳本文字複製')}});
</script></body></html>
